name: Daily scrape & reminders

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit, no messages)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt

      - name: Scrape official sites & news
        run: python scraper/scrape.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Send reminders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scraper/remind.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Build calendar feed & documents manifest
        run: |
          python scraper/build_ics.py
          python scraper/build_docs_manifest.py

      - name: Commit data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "pariksha-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/updates.json public/data/scrape_status.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily scrape $(date -u +%Y-%m-%d)"
            git push
          fi

      # Bot commits don't trigger deploy.yml, so redeploy here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@v4
