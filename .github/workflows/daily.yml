name: Daily scrape & reminders

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit, no messages)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt

      - name: Intake tracked openings from issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper/intake.py

      - name: Scrape official sites & news
        run: python scraper/scrape.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Discover openings that fit the profile
        run: python scraper/discover.py

      - name: Scan job portals for fresher roles
        timeout-minutes: 12
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python scraper/portals.py

      - name: Send reminders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scraper/remind.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Build calendar feed & documents manifest
        run: |
          python scraper/build_ics.py
          python scraper/build_docs_manifest.py

      - name: Commit data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "jenny-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/updates.json public/data/scrape_status.json public/data/opportunities.json public/data/exams.json public/calendar.ics
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily scrape $(date -u +%Y-%m-%d)"
            # main may have moved while the scan ran (a merged PR): replay the data commit on top of it, keeping today's data.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
              git push && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 5))
            done
          fi

      # Bot commits don't trigger deploy.yml, so redeploy here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@v4
